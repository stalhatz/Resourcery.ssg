[tool.poetry]
name = "static-link-aggregator"
version = "1.0.0"
description = "A static link aggregation website with JSON schema validation"
authors = ["Your Name <you@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.8"
jinja2 = "^3.0.0"
jsonschema = "^4.0.0"
pyyaml = "^6.0.0"
requests = "^2.31.0"
beautifulsoup4 = "^4.12.0"
pillow = "^10.0.0"
pyppeteer = "^1.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^23.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
build = "build:build"
acquire-images = "image_acquirer:main"