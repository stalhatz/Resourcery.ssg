[tool.poetry]
name = "Resourcery.ssg"
version = "0.1.1"
description = "A static link aggregation website with JSON schema validation"
authors = ["stalhatz@gmail.com"]
license = "MIT"
packages = [{ include = "resourcery_ssg", from = "src" }]
include = ["src/resourcery_ssg/config.yaml"]

[tool.poetry.dependencies]
python = "^3.8"
jinja2 = "^3.0.0"
jsonschema = "^4.0.0"
pyyaml = "^6.0.0"
requests = "^2.31.0"
beautifulsoup4 = "^4.12.0"
pillow = "^10.0.0"
pyppeteer = "^1.0.2"
trafilatura = "^2.0.0"
duckduckgo-search = "^6.0.0"
openai = "^1.50.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^23.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: pure unit tests, no I/O or network",
    "integration: end-to-end workflow action tests",
    "network: tests that make real network calls (skipped by default)",
    "e2e: end-to-end tests that require an LLM model (skipped by default)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
build = "resourcery_ssg.build:main"
acquire-images = "resourcery_ssg.image_acquirer:main"
ingest = "resourcery_ssg.data_ingestion:main"
validate = "resourcery_ssg.validate:main"
acquire-fonts = "resourcery_ssg.font_acquirer:main"
site = "resourcery_ssg.site:main"