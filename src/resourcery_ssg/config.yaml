vars:
  STATIC_DIR: ./static
  DATA_DIR: ./data
  TEMPLATES_DIR: ./templates
  SCHEMAS_DIR: ./schemas
  OUTPUT_DIR: ./output
  FONTS_DIR: ${STATIC_DIR}/fonts
  CSS_DIR: ${STATIC_DIR}/css
  IMAGES_DIR: ${STATIC_DIR}/images/acquired

build:
  data_dir: ${DATA_DIR}
  templates_dir: ${TEMPLATES_DIR}
  static_dir: ${STATIC_DIR}
  output_dir: ${OUTPUT_DIR}
  # attribution: false           # set to true to enable build-time attribution footer + source pages
validate:
  data_dir: ${DATA_DIR}
  schemas_dir: ${SCHEMAS_DIR}
acquire-fonts:
  data_dir: ${DATA_DIR}
  fonts_dir: ${FONTS_DIR}
  css_dir: ${CSS_DIR}
acquire-images:
  links: ${DATA_DIR}/links.json
  images_dir: ${IMAGES_DIR}
ingest:
  schemas_dir: ${SCHEMAS_DIR}
  prompt: ./prompts/data-ingestion.md
  output_dir: ${OUTPUT_DIR}
  model: gpt-4o
  multi_step: false
  max_retries: 3
  opencode_bin: opencode
  # note: ./my-note.md                 # optional — path to source note file (required if build.attribution is true)
  # site_prompt: ./my-site-prompt.md   # optional — path to site prompt file (required if build.attribution is true)

  # Per-stage configuration (optional). Uncomment to enable selective execution
  # and per-stage model/max_retries overrides. Listed stages run in pipeline
  # order (site.config → links → design). Unlisted stages are skipped.
  #   stages:
  #     site.config:                  # uses global model and max_retries
  #     design:                       # overrides model and max_retries
  #       model: claude-sonnet-4
  #       max_retries: 5
