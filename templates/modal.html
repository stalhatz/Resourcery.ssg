<div class="modal-overlay" id="modalOverlay" style="display: none;">
    <div class="modal" id="modal" tabindex="-1" role="dialog" aria-modal="true">
        <button class="modal-close" id="modalClose" aria-label="Close modal">×</button>
        
        <div class="modal-header">
            <div class="modal-image" id="modalImage"></div>
            <div class="modal-title-section">
                <h2 class="modal-title" id="modalTitle">Resource Title</h2>
                <div class="modal-badges">
                    <span class="modal-category" id="modalCategory">Category</span>
                    <span class="modal-pricing" id="modalPricing">Free</span>
                    <span class="modal-language" id="modalLanguage">EN</span>
                    <span class="modal-share" id="modalShare" title="Copy link">🔗</span>
                </div>
            </div>
        </div>
        
        <div class="modal-body">
            <div class="modal-section">
                <h4>Summary</h4>
                <p id="modalSummary">Resource summary...</p>
            </div>
            
            <div class="modal-section">
                <h4>Description</h4>
                <p id="modalDescription">Full description...</p>
            </div>
            
            <div class="modal-section">
                <h4>Tags</h4>
                <div class="modal-tags" id="modalTags"></div>
            </div>
        </div>
        
        <div class="modal-footer">
            <a href="#" class="modal-visit-btn" id="modalVisit" target="_blank" rel="noopener">
                Visit Resource →
            </a>
        </div>
    </div>
</div>
